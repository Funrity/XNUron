name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Tools for host tests
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm zlib1g-dev
      - name: Host tests (core, instructions, differential, system mode, loaders, JNI)
        run: |
          export LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | head -1)
          tests/run_all.sh
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xnuron-apk
          path: app/build/outputs/apk/debug/*.apk
