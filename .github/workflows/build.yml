name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to publish the APK as a GitHub release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Tools for host tests
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm zlib1g-dev
      - name: Host tests (core, instructions, differential, system mode, loaders, JNI)
        run: |
          export LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | head -1)
          tests/run_all.sh
      - name: Build APK
        run: gradle assembleDebug
      - name: Name the APK
        id: ver
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$v" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/*.apk "XNUron-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: xnuron-apk-${{ steps.ver.outputs.name }}
          path: XNUron-${{ steps.ver.outputs.name }}.apk
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" "XNUron-$V.apk" --target "$GITHUB_SHA" --prerelease \
            --title "XNUron $V" \
            --notes "Automated build of commit ${GITHUB_SHA::7}. Experimental: it does not run iOS, see the README. / Автоматическая сборка коммита ${GITHUB_SHA::7}. Экспериментальный проект: iOS не запускается, см. README."
      - name: Prune old builds (keep only the newest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
          jq -r '[.[][] | select(.tag_name | test("^v[0-9]"))] | sort_by(.created_at) | reverse | .[1:][] | .tag_name' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag || true; done
