name: Boot attempt (headless)
on:
  workflow_dispatch:
    inputs:
      kernel_size:
        description: "compressed size of kernelcache.release.iphone11 in the IPSW (bytes), from the app log"
        default: "16875356"
      device:
        description: "ipsw.me device identifier"
        default: "iPhone11,4"
      max_msteps:
        description: "step limit, millions"
        default: "4000"
permissions:
  contents: write   # to publish the log as a release asset (the session can download release assets)
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build the headless runner (same C sources as the APK)
        run: |
          C=app/src/main/cpp; LZ=$C/lzfse
          gcc -O2 -w -I$C -o boot_cli tools/boot_cli.c $C/attempt.c $C/macho.c $C/machine.c $C/arm64.c $C/inspect.c $C/img4.c $C/zipinfo.c \
            $LZ/lzfse_decode.c $LZ/lzfse_decode_base.c $LZ/lzfse_fse.c $LZ/lzvn_decode_base.c -lm -lz -lpthread
      - name: IPSW cache (only to save download time; the file comes from Apple's public server)
        uses: actions/cache@v4
        with:
          path: ipsw.zip
          key: ipsw-kc-${{ inputs.kernel_size }}
      - name: Find and download the IPSW (public Apple download, not stored in the repository)
        run: |
          [ -s ipsw.zip ] && { echo "cached"; exit 0; }
          url=$(python3 tools/find_ipsw.py "${{ inputs.device }}" "${{ inputs.kernel_size }}")
          echo "IPSW: $url"
          curl -sSL --fail -o ipsw.zip "$url"; ls -l ipsw.zip
      - name: Run
        run: |
          set +e
          XN_HIST_PC=7a08820 ./boot_cli ipsw.zip "${{ inputs.max_msteps }}" > boot.log 2> boot.err
          cat boot.err; wc -c boot.log
      - name: "IPSW report (read-only; names, sizes, KBAG presence)"
        run: python3 tools/ipsw_report.py ipsw.zip > ipsw.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with: { name: boot-log, path: "boot.log\nboot.err" }
      - name: Publish the log as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete boot-log --yes --cleanup-tag 2>/dev/null || true
          gh release create boot-log boot.log boot.err ipsw.txt --target "$GITHUB_SHA" --prerelease --title "Headless boot log" \
            --notes "Лог headless-запуска попытки загрузки (коммит ${GITHUB_SHA::7}). Не прошивка и не загрузка iOS."
